services:
  helios:
    build: .
    container_name: helios
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/server/data
      - HELIOS_ADMIN_EMAIL=${HELIOS_ADMIN_EMAIL}
      - HELIOS_ADMIN_PASSWORD=${HELIOS_ADMIN_PASSWORD}
    volumes:
      - helios-data:/app/server/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  helios-data:
